services:
  api1: &api-service
    image: rinhadebackend2026
    container_name: api1
    hostname: api1
    build:
      context: .
      dockerfile: RinhaDeBackend2026/Dockerfile
    expose:
      - "8080"
    ports:
      - "3001:8080"
    environment:
      - ASPNETCORE_URLS=http://*:8080
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "150MB"

  api2:
    <<: *api-service
    container_name: api2
    ports:
      - "3002:8080"
    hostname: api2

  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          memory: 50mb
